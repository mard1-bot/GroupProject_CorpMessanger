# Coturn TURN server configuration for production
# This file is mounted into the coturn container

# Network listening
listening-port=3478
listening-ip=0.0.0.0
relay-ip=0.0.0.0
external-ip=${TURN_EXTERNAL_IP}

# Authentication
lt-cred-mech
user=${TURN_USERNAME}:${TURN_PASSWORD}

# TLS/DTLS (required for WebRTC in production)
cert=/certs/server.crt
pkey=/certs/server.key
tls-listening-port=5349
dtls-listening-port=5349

# Limits
max-bps=3000000
bps-capacity=0
total-quota=100
stale-nonce=600
channel-lifetime=600
permission-lifetime=300

# Logging
log-file=/var/log/turnserver/turnserver.log
verbose
no-stdout-log

# Security
no-cli
secure-stun
