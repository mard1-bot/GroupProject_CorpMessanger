services:
  postgres:
    image: postgres:16-alpine
    container_name: corp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: corpmessenger
      POSTGRES_USER: corpmessenger
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    expose:
      - "5432"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corpmessenger"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql

  redis:
    image: redis:7-alpine
    container_name: corp-redis
    restart: unless-stopped
    expose:
      - "6379"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  glitchtip:
    image: glitchtip/glitchtip:latest
    container_name: corp-glitchtip
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://corpmessenger:${POSTGRES_PASSWORD}@postgres:5432/glitchtip?sslmode=disable
      SECRET_KEY_FILE: /run/secrets/glitchtip_secret_key
      EMAIL_URL: smtp://localhost
      DEFAULT_FROM_EMAIL: noreply@corpmessenger.com
      ENABLE_USER_REGISTRATION: "false"
      DEPLOY: "docker"
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - glitchtip_secret_key
      - postgres_password
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  livekit:
    image: livekit/livekit-server:latest
    container_name: corp-livekit
    restart: unless-stopped
    network_mode: "host"
    command: --redis-host 127.0.0.1:6379 --node-ip 2.26.8.168
    environment:
      LIVEKIT_KEYS: "Vge/dAtVjR5fiqJ1: xCNazDyUDTDMuPOIIIrWWnI9RmawSO8lhyJkiEJZ8Axt8+fRYqq+Vw"
      LIVEKIT_REDIS_ADDRESS: "127.0.0.1:6379"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./certs:/certs:ro
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: "host"
#    ports:
#      - "3478:3478/tcp"
#      - "3478:3478/udp"
#      - "5349:5349/tcp"
#      - "5349:5349/udp"
#      - "50000-50050:50000-50050/udp"
#      - "50000-50050:50000-50050/tcp"
    environment:
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-$(curl -s ifconfig.me)}
      TURN_USERNAME: ${TURN_USERNAME:-turnuser}
      TURN_PASSWORD: ${TURN_PASSWORD_FILE:-/run/secrets/turn_password}
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./certs:/certs:ro
      - ./data/coturn:/var/log/turnserver
    secrets:
      - turn_password
    command: /bin/sh -c 'turnserver -c /etc/coturn/turnserver.conf --external-ip=$${TURN_EXTERNAL_IP:-2.26.8.168} --user=$${TURN_USERNAME:-turnuser}:$$(cat /run/secrets/turn_password)'
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  nginx:
    image: nginx:alpine
    container_name: corp-nginx
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/certs:ro
      - ./data/nginx/logs:/var/log/nginx
      - ./data/certbot:/var/www/certbot
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/run/nginx

  frontend:
    image: nginx:alpine
    container_name: corp-frontend
    restart: unless-stopped
    volumes:
      - ./client/dist:/usr/share/nginx/html:ro
      - ./client/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/run/nginx

  certbot:
    image: certbot/certbot
    container_name: corp-certbot
    volumes:
      - ./certs:/etc/letsencrypt
      - ./data/certbot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  ejabberd:
    image: ejabberd/ecs:24.07
    container_name: corp-ejabberd
    restart: unless-stopped
    ports:
      - "5222:5222"
      - "5269:5269"
    volumes:
      - ./backend/ejabberd:/home/kong/ejabberd/conf
      - ./data/ejabberd:/home/kong/ejabberd/database
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
      args:
        GOPROXY: https://proxy.golang.org,direct
    container_name: corp-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    dns:
      - 8.8.8.8
      - 8.8.4.4
    network_mode: "host"
    environment:
      APP_ENV: prod
      BASE_URL: https://finchgram.ru
      HTTP_PORT: 8080
      HTTPS_PORT: 8443
      LOG_LEVEL: info
      DATABASE_URL_FILE: /run/secrets/database_url
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      EJABBERD_HOST: 127.0.0.1
      EJABBERD_PORT: 5222
      EJABBERD_USERNAME: admin
      EJABBERD_PASSWORD_FILE: /run/secrets/ejabberd_password
      EJABBERD_ADMIN_USER: admin@ejabberd
      LIVEKIT_URL: http://127.0.0.1:7880
      LIVEKIT_PUBLIC_URL_FILE: /run/secrets/livekit_url
      LIVEKIT_API_KEY_FILE: /run/secrets/livekit_api_key
      LIVEKIT_API_SECRET_FILE: /run/secrets/livekit_api_secret
      ENCRYPTION_MASTER_KEY_FILE: /run/secrets/encryption_master_key
      CORS_ORIGINS_FILE: /run/secrets/cors_origins
      TLS_ENABLED: "false"
      TLS_CERT_PATH: /certs/server.crt
      TLS_KEY_PATH: /certs/server.key
      SCHEDULER_ENABLED: "true"
      REDIS_URL: 127.0.0.1:6379
      SENTRY_DSN_FILE: /run/secrets/sentry_dsn
      VAPID_PUBLIC_KEY: "BDxQrS09IYxG9Za7P2VJ4mRBi1yASey-8PqskldZypnoL_Rqu6EMMy1n7UWxXAjrpyQxzMuGtoj_7MONOnQUVXw"
      VAPID_PRIVATE_KEY: "4nnPtrRxpy5kX0iMXgSqnY-YbxOM0N8laoWrv3dpPtw"
    depends_on:
      postgres:
        condition: service_healthy
      ejabberd:
        condition: service_started
      livekit:
        condition: service_started
    volumes:
      - ./data/uploads:/app/uploads
      - ./certs:/certs:ro
    secrets:
      - database_url
      - jwt_secret
      - ejabberd_password
      - livekit_url
      - livekit_api_key
      - livekit_api_secret
      - encryption_master_key
      - cors_origins
      - sentry_dsn
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /app/cache

secrets:
  postgres_password:
    file: ./.secrets/postgres_password
  database_url:
    file: ./.secrets/database_url
  jwt_secret:
    file: ./.secrets/jwt_secret
  ejabberd_password:
    file: ./.secrets/ejabberd_password
  livekit_url:
    file: ./.secrets/livekit_url
  livekit_api_key:
    file: ./.secrets/livekit_api_key
  livekit_api_secret:
    file: ./.secrets/livekit_api_secret
  livekit_keys:
    file: ./.secrets/livekit_keys
  encryption_master_key:
    file: ./.secrets/encryption_master_key
  cors_origins:
    file: ./.secrets/cors_origins
  turn_password:
    file: ./.secrets/turn_password
  glitchtip_secret_key:
    file: ./.secrets/glitchtip_secret_key
  sentry_dsn:
    file: ./.secrets/sentry_dsn
