services:
  postgres:
    image: postgres:16-alpine
    container_name: corp-postgres
    environment:
      POSTGRES_DB: corp_messenger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"

  ejabberd:
    image: ejabberd/ecs:latest
    container_name: corp-ejabberd
    environment:
      - EJABBERD_DOMAIN=localhost
      - EJABBERD_ADMINS=admin@localhost
      - EJABBERD_USERS=admin@localhost:admin
    ports:
      - "5222:5222"    # XMPP client
      - "5269:5269"    # XMPP server-to-server
      - "5280:5280"    # HTTP admin API
      - "5443:5443"    # HTTP websockets
    volumes:
      - ejabberd_data:/home/ejabberd

  backend:
    build: ./backend
    container_name: corp-backend
    depends_on:
      - postgres
      - ejabberd
    environment:
      APP_ENV: local
      HTTP_PORT: 8080
      LOG_LEVEL: debug
      DB_DSN: postgres://postgres:postgres@postgres:5432/corp_messenger?sslmode=disable
      XMPP_HOST: ejabberd
      XMPP_PORT: 5222
    ports:
      - "8080:8080"

volumes:
  ejabberd_data:
