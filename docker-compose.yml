services:
  redis:
    image: redis:7-alpine
    container_name: corp-redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --tcp-keepalive 300 --timeout 0
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  coturn:
    image: coturn/coturn:4.6.2
    container_name: corp-coturn
    network_mode: host
    command: >
      --log-file=stdout
      --external-ip=${TURN_EXTERNAL_IP}
      --listening-port=3478
      --fingerprint
      --lt-cred-mech
      --user=${TURN_USERNAME}:${TURN_PASSWORD}
      --realm=corpmessenger
      --no-cli
      --no-tls
      --no-dtls
    environment:
      TURN_USERNAME: ${TURN_USERNAME}
      TURN_PASSWORD: ${TURN_PASSWORD}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP}
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    container_name: corp-livekit
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      LIVEKIT_KEYS: ${LIVEKIT_KEYS}
      LIVEKIT_REDIS_ADDRESS: "redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - with-livekit

  ejabberd:
    image: ejabberd/ecs:24.07
    container_name: corp-ejabberd
    ports:
      - "5222:5222"
      - "5269:5269"
      - "5280:5280"
    volumes:
      - ./backend/ejabberd:/home/kong/ejabberd/conf
      - ./data/ejabberd:/home/kong/ejabberd/database

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        GOPROXY: https://proxy.golang.org,direct
    container_name: corp-backend
    network_mode: host
    environment:
      APP_ENV: ${APP_ENV}
      HTTP_PORT: ${HTTP_PORT}
      HTTPS_PORT: ${HTTPS_PORT}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/corp_messenger?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      EJABBERD_HOST: localhost
      EJABBERD_PORT: 5280
      EJABBERD_USERNAME: ${EJABBERD_USERNAME}
      EJABBERD_PASSWORD: ${EJABBERD_PASSWORD}
      EJABBERD_ADMIN_USER: ${EJABBERD_ADMIN_USER}
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ENABLE_HTTPS: ${ENABLE_HTTPS}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED}
      REDIS_URL: localhost:6379
      TURN_SERVER_URI: turn:${TURN_EXTERNAL_IP}:3478
      TURN_USERNAME: ${TURN_USERNAME}
      TURN_PASSWORD: ${TURN_PASSWORD}
      TLS_ENABLED: ${TLS_ENABLED}
      TLS_CERT_PATH: ${TLS_CERT_PATH}
      TLS_KEY_PATH: ${TLS_KEY_PATH}
      HYBRID_MODE: ${HYBRID_MODE}
      XMPP_SYNC_ENABLED: ${XMPP_SYNC_ENABLED}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    depends_on:
      ejabberd:
        condition: service_started
      coturn:
        condition: service_started
    volumes:
      - ./backend/uploads:/app/uploads
      - ./certs:/app/certs:ro
