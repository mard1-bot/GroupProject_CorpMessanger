# Nginx reverse proxy configuration for CorpMessenger
# Provides rate limiting, SSL termination, and basic DDoS protection

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Rate limiting zones
    # General API rate limit: 100 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    
    # Auth endpoint: stricter limit (10 requests per minute)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    
    # Upload endpoint: 5 requests per minute
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=5r/m;
    
    # Connection limit: 20 concurrent connections per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream backend server
    upstream backend {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    # Upstream frontend server
    upstream frontend {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    # HTTP to HTTPS redirect
    server {
        listen 80;
        server_name _;
        
        # Allow Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # SSL certificates
        ssl_certificate /certs/server.crt;
        ssl_certificate_key /certs/server.key;

        # Let Nginx use its default safe SSL configuration
        # ssl_protocols TLSv1.2 TLSv1.3;
        # ssl_ciphers '...';
        # ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Connection limit
        limit_conn conn_limit 20;

        # Proxy settings
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;

        # Health check endpoint (no rate limit)
        location /health {
            proxy_pass http://backend;
            access_log off;
        }

        # Auth endpoints (stricter rate limit)
        location ~ ^/(api/v1/(auth|login|register|forgot-password)) {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://backend;
        }

        # Upload endpoints (stricter rate limit)
        location ~ ^/(api/v1/(upload|avatar)) {
            limit_req zone=upload_limit burst=2 nodelay;
            proxy_pass http://backend;
        }

        # All API endpoints (general rate limit)
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend;
        }

        # WebSocket connections (no rate limit, but connection limit applies)
        location /ws {
            proxy_pass http://backend;
            proxy_buffering off;
        }

        # Static files (if any)
        location /static/ {
            proxy_pass http://backend;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Root location
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
