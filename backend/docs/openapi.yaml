openapi: 3.0.3
info:
  title: Corporate Messenger API
  description: |
    RESTful API for the Corporate Messenger application.
    Features include user management, chats, messaging, reactions, file uploads, and more.
  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.example.com
    description: Production server

tags:
  - name: Auth
    description: Authentication and user management
  - name: Users
    description: User profile management
  - name: Chats
    description: Chat management
  - name: Messages
    description: Message operations
  - name: Reactions
    description: Message reactions
  - name: Files
    description: File uploads and management
  - name: Notifications
    description: Notification settings and subscriptions
  - name: Encryption
    description: End-to-end encryption
  - name: Audit
    description: Audit logs

paths:
  /health:
    get:
      summary: Health check
      description: Check if the API is running
      operationId: healthCheck
      tags:
        - System
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /ready:
    get:
      summary: Readiness check
      description: Check if the API and its dependencies are ready
      operationId: readinessCheck
      tags:
        - System
      responses:
        '200':
          description: API is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/register:
    post:
      summary: Register a new user
      operationId: register
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/login:
    post:
      summary: Login user
      operationId: login
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/logout:
    post:
      summary: Logout user
      operationId: logout
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: logged_out
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/me:
    get:
      summary: Get current user
      operationId: getCurrentUser
      tags:
        - Auth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User data retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/change-password:
    post:
      summary: Change password
      operationId: changePassword
      tags:
        - Auth
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: updated
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/chats:
    post:
      summary: Create a new chat
      operationId: createChat
      tags:
        - Chats
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatRequest'
      responses:
        '201':
          description: Chat created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      summary: Get user's chats
      operationId: getUserChats
      tags:
        - Chats
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of chats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Chat'

  /api/v1/chats/{id}:
    get:
      summary: Get chat by ID
      operationId: getChat
      tags:
        - Chats
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChatID'
      responses:
        '200':
          description: Chat data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '404':
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Update chat
      operationId: updateChat
      tags:
        - Chats
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChatID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChatRequest'
      responses:
        '200':
          description: Chat updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete chat
      operationId: deleteChat
      tags:
        - Chats
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChatID'
      responses:
        '200':
          description: Chat deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: deleted
        '404':
          description: Chat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/chats/{id}/messages:
    post:
      summary: Send a message
      operationId: sendMessage
      tags:
        - Messages
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChatID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '201':
          description: Message sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      summary: Get chat messages
      operationId: getChatMessages
      tags:
        - Messages
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChatID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ChatID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Chat ID

    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        maximum: 100
      description: Number of items to return

    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Number of items to skip

  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          description: Error code
        message:
          type: string
          description: Human-readable error message
      required:
        - code
        - message

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        middle_name:
          type: string
        phone:
          type: string
        avatar:
          type: string
        status:
          type: string
          enum: [active, inactive, suspended]
        role:
          type: string
          enum: [user, admin]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - email
        - first_name
        - last_name

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        first_name:
          type: string
        last_name:
          type: string
        middle_name:
          type: string
        phone:
          type: string
      required:
        - email
        - password
        - first_name
        - last_name

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      required:
        - email
        - password

    ChangePasswordRequest:
      type: object
      properties:
        old_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8
      required:
        - old_password
        - new_password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT token
        user:
          $ref: '#/components/schemas/User'
      required:
        - token
        - user

    Chat:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [direct, group]
        avatar:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        members:
          type: array
          items:
            $ref: '#/components/schemas/ChatMember'
      required:
        - id
        - type

    ChatMember:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, admin, member]
        joined_at:
          type: string
          format: date-time

    CreateChatRequest:
      type: object
      properties:
        type:
          type: string
          enum: [direct, group]
        title:
          type: string
        description:
          type: string
        members:
          type: array
          items:
            type: object
            properties:
              user_id:
                type: string
                format: uuid
              role:
                type: string
                enum: [owner, admin, member]
      required:
        - type

    UpdateChatRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string

    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        chat_id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [text, image, file, voice, video]
        content:
          type: string
        file_url:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        reply_to:
          type: string
          format: uuid
        thread_id:
          type: string
          format: uuid
        forwarded_from:
          type: string
          format: uuid
        reactions:
          type: array
          items:
            $ref: '#/components/schemas/Reaction'
      required:
        - id
        - chat_id
        - sender_id
        - type

    SendMessageRequest:
      type: object
      properties:
        content:
          type: string
        type:
          type: string
          enum: [text, image, file, voice, video]
          default: text
        reply_to:
          type: string
          format: uuid
        thread_id:
          type: string
          format: uuid
        file:
          type: object
          properties:
            filename:
              type: string
            content_type:
              type: string
            data:
              type: string
              format: base64
      required:
        - content

    Reaction:
      type: object
      properties:
        emoji:
          type: string
        user_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
